<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Crimson glow gradient -->
    <radialGradient id="glow" cx="75%" cy="85%" r="55%" fx="75%" fy="85%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#A30D22" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Subtle top glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Blue accent glow -->
    <radialGradient id="blueGlow" cx="85%" cy="50%" r="15%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Halftone pattern -->
    <pattern id="halftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.8" fill="#E62429" opacity="0.07"/>
    </pattern>
    
    <!-- Web pattern for background -->
    <pattern id="webPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <line x1="100" y1="0" x2="100" y2="200" stroke="#E62429" stroke-width="0.3" opacity="0.04"/>
      <line x1="0" y1="100" x2="200" y2="100" stroke="#E62429" stroke-width="0.3" opacity="0.04"/>
      <line x1="0" y1="0" x2="200" y2="200" stroke="#E62429" stroke-width="0.3" opacity="0.03"/>
      <line x1="200" y1="0" x2="0" y2="200" stroke="#E62429" stroke-width="0.3" opacity="0.03"/>
    </pattern>

    <!-- Noise filter for texture -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="400" fill="#09090B"/>
  
  <!-- Halftone texture overlay -->
  <rect width="1200" height="400" fill="url(#halftone)"/>
  
  <!-- Web geometry background -->
  <rect width="1200" height="400" fill="url(#webPattern)"/>
  
  <!-- Crimson glow from bottom right -->
  <rect width="1200" height="400" fill="url(#glow)"/>
  
  <!-- Top ambient glow -->
  <rect width="1200" height="400" fill="url(#topGlow)"/>
  
  <!-- Blue accent glow -->
  <rect width="1200" height="400" fill="url(#blueGlow)"/>

  <!-- Minimal NYC Skyline Silhouette (right side) -->
  <g opacity="0.25">
    <rect x="650" y="240" width="28" height="160" fill="#111114"/>
    <rect x="685" y="200" width="22" height="200" fill="#111114"/>
    <rect x="715" y="260" width="18" height="140" fill="#111114"/>
    <rect x="740" y="180" width="30" height="220" fill="#111114"/>
    <rect x="778" y="220" width="20" height="180" fill="#111114"/>
    <rect x="805" y="160" width="35" height="240" fill="#111114"/>
    <rect x="848" y="240" width="24" height="160" fill="#111114"/>
    <rect x="880" y="140" width="28" height="260" fill="#111114"/>
    <!-- Spire -->
    <rect x="891" y="100" width="4" height="40" fill="#111114"/>
    <rect x="915" y="210" width="20" height="190" fill="#111114"/>
    <rect x="942" y="250" width="26" height="150" fill="#111114"/>
    <rect x="975" y="190" width="32" height="210" fill="#111114"/>
    <rect x="1015" y="230" width="22" height="170" fill="#111114"/>
    <rect x="1045" y="170" width="28" height="230" fill="#111114"/>
    <rect x="1080" y="250" width="20" height="150" fill="#111114"/>
    <rect x="1108" y="210" width="35" height="190" fill="#111114"/>
    <rect x="1150" y="260" width="50" height="140" fill="#111114"/>
  </g>

  <!-- Skyline window lights (tiny red/warm dots) -->
  <g opacity="0.4">
    <rect x="750" y="220" width="2" height="2" fill="#E62429" opacity="0.8"/>
    <rect x="755" y="240" width="2" height="2" fill="#E62429" opacity="0.5"/>
    <rect x="812" y="200" width="2" height="2" fill="#E62429" opacity="0.7"/>
    <rect x="818" y="230" width="2" height="2" fill="#E62429" opacity="0.4"/>
    <rect x="888" y="180" width="2" height="2" fill="#E62429" opacity="0.8"/>
    <rect x="892" y="210" width="2" height="2" fill="#E62429" opacity="0.6"/>
    <rect x="983" y="230" width="2" height="2" fill="#E62429" opacity="0.5"/>
    <rect x="1055" y="210" width="2" height="2" fill="#E62429" opacity="0.7"/>
    <rect x="1120" y="250" width="2" height="2" fill="#E62429" opacity="0.4"/>
    <!-- Blue accent window -->
    <rect x="1050" y="190" width="2" height="2" fill="#00A8FF" opacity="0.6"/>
    <rect x="820" y="180" width="2" height="2" fill="#00A8FF" opacity="0.4"/>
  </g>

  <!-- Web geometry lines (radiating from right) -->
  <g opacity="0.08" stroke="#E62429" stroke-width="0.5" fill="none">
    <line x1="1200" y1="200" x2="600" y2="50"/>
    <line x1="1200" y1="200" x2="500" y2="150"/>
    <line x1="1200" y1="200" x2="550" y2="300"/>
    <line x1="1200" y1="200" x2="650" y2="380"/>
    <line x1="1200" y1="200" x2="700" y2="100"/>
    <!-- Web arcs -->
    <path d="M 850,120 Q 900,140 880,190"/>
    <path d="M 780,90 Q 850,120 830,200"/>
    <path d="M 900,280 Q 950,260 930,200"/>
  </g>

  <!-- Horizontal red accent line -->
  <line x1="80" y1="310" x2="450" y2="310" stroke="#E62429" stroke-width="2" opacity="0.6"/>
  <line x1="450" y1="310" x2="550" y2="310" stroke="#E62429" stroke-width="2" opacity="0.2"/>
  
  <!-- Red accent dot on the line -->
  <circle cx="80" cy="310" r="3" fill="#E62429" opacity="0.8"/>

  <!-- Name text -->
  <text x="80" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F5F5" letter-spacing="4">
    VIVEK
  </text>
  <text x="80" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F5F5" letter-spacing="4">
    CHOUDHARY
  </text>
  
  <!-- Tagline -->
  <text x="83" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#A1A1AA" letter-spacing="3" font-weight="400">
    COMPUTER SCIENCE  •  AI &amp; ML  •  FULL-STACK
  </text>

  <!-- Small red accent mark next to name -->
  <rect x="60" y="148" width="4" height="90" fill="#E62429" rx="2"/>

  <!-- Bottom bar -->
  <rect x="0" y="395" width="1200" height="5" fill="#E62429" opacity="0.5"/>
  
  <!-- Scattered particles -->
  <circle cx="500" cy="80" r="1" fill="#E62429" opacity="0.3"/>
  <circle cx="620" cy="120" r="1.5" fill="#E62429" opacity="0.2"/>
  <circle cx="350" cy="60" r="1" fill="#E62429" opacity="0.25"/>
  <circle cx="580" cy="350" r="1" fill="#E62429" opacity="0.15"/>
  <circle cx="450" cy="150" r="0.8" fill="#00A8FF" opacity="0.2"/>
  <circle cx="300" cy="340" r="1" fill="#E62429" opacity="0.2"/>
  
  <!-- Subtle corner web detail (top left) -->
  <g opacity="0.05" stroke="#F5F5F5" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="80" y2="40"/>
    <line x1="0" y1="0" x2="50" y2="60"/>
    <line x1="0" y1="0" x2="30" y2="70"/>
    <path d="M 20,10 Q 35,25 15,35"/>
    <path d="M 40,15 Q 50,35 25,50"/>
  </g>
</svg>
